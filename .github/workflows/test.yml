name: test

on: [push, pull_request]

jobs:
  test:
    name: lint, types, tests, published studies (CPython ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # `requires-python` admits every CPython from 3.14, and a published count rests on
    # `Random.choice` and `Random.shuffle`, which Python does not promise to keep across
    # versions: each released version reruns every study.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { version: "0.13.5", python-version: "${{ matrix.python }}", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python tools/check_markdown.py
      - run: uv run pytest
      # Every published count is one this code still produces.
      - run: uv run python tools/curve.py blocksworld --check docs/studies/blocksworld.json
      - run: uv run python tools/curve.py gripper --check docs/studies/gripper.json
      - run: uv run python tools/curve.py blocksworld --check docs/studies/blocksworld-optimistic.json
      - run: uv run python tools/curve.py logistics --check docs/studies/logistics.json
