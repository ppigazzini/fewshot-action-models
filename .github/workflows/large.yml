name: slow studies

# The studies over large test sizes, and those whose models a noisy or misread observer
# leaves without preconditions, search to their bounds for minutes, so they run weekly and on
# demand instead of on every push.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  large:
    name: published studies that take minutes
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.5", python-version: "3.14", enable-cache: true }
      - run: uv sync --locked
      - run: uv run python tools/curve.py blocksworld --check docs/studies/blocksworld-large.json
      - run: uv run python tools/curve.py gripper --check docs/studies/gripper-large.json
      - run: uv run python tools/curve.py logistics --check docs/studies/logistics-large.json
      - run: uv run python tools/curve.py blocksworld --check docs/studies/blocksworld-masked-sam.json
      - run: uv run python tools/curve.py blocksworld --check docs/studies/blocksworld-noise.json
